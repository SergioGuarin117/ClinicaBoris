<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pago Exitoso — Dr. Boris Viafara</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--green:#0D7A52;--green-bg:#E6F5EF;--green-mid:#B7E4CE;--text:#0F1C2E;--text-2:#4A5568;--text-3:#8FA3BE;--border:#DDE3ED;--surface:#FFFFFF;--bg:#EEF2F7;--font:'DM Sans',sans-serif;--serif:'Crimson Pro',serif;--mono:'DM Mono',monospace;}
    body{font-family:var(--font);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
      background-image:radial-gradient(circle at 20% 80%,rgba(13,122,82,0.08) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(27,79,216,0.06) 0%,transparent 45%);}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(15,28,46,0.08);}
    .icon-wrap{width:80px;height:80px;border-radius:50%;background:var(--green-bg);border:3px solid var(--green-mid);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;}
    @keyframes popIn{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
    .icon-wrap svg{width:38px;height:38px;color:var(--green);}
    .icon-wrap svg path{stroke-dasharray:50;stroke-dashoffset:50;animation:drawCheck 0.4s 0.3s ease forwards;}
    @keyframes drawCheck{to{stroke-dashoffset:0}}
    h1{font-family:var(--serif);font-size:2.2rem;font-weight:700;color:var(--text);margin-bottom:0.5rem;animation:fadeUp 0.4s 0.2s ease both;}
    .subtitle{font-size:15px;color:var(--text-2);line-height:1.6;margin-bottom:2rem;animation:fadeUp 0.4s 0.3s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .detail-box{background:var(--green-bg);border:1px solid var(--green-mid);border-radius:14px;padding:1.2rem 1.5rem;margin-bottom:2rem;text-align:left;animation:fadeUp 0.4s 0.4s ease both;}
    .detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--green-mid);font-size:13.5px;}
    .detail-row:last-child{border-bottom:none;}
    .detail-label{color:var(--green);font-weight:500;}
    .detail-val{color:var(--text);font-weight:600;font-family:var(--mono);}
    .btn-portal{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:12px 28px;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;transition:background 0.15s,transform 0.1s;box-shadow:0 4px 16px rgba(13,122,82,0.3);animation:fadeUp 0.4s 0.5s ease both;}
    .btn-portal:hover{background:#0a6343;transform:translateY(-1px);}
    .confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;}
    .c-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:fall linear forwards;}
    @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  </style>
</head>
<body>
<div class="confetti" id="confetti"></div>
<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>
  <h1>¡Pago exitoso!</h1>
  <p class="subtitle">Tu cita ha sido confirmada y el pago procesado correctamente. Recibirás un correo de confirmación.</p>
  <div class="detail-box" id="detailBox">
    <div class="detail-row"><span class="detail-label">Estado</span><span class="detail-val">✓ Aprobado</span></div>
    <div class="detail-row"><span class="detail-label">ID de pago</span><span class="detail-val" id="d-payment-id">—</span></div>
    <div class="detail-row"><span class="detail-label">Referencia</span><span class="detail-val" id="d-ref">—</span></div>
  </div>
  <a href="paciente/portal_paciente.html" class="btn-portal">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Ir a mi portal
  </a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('d-payment-id').textContent = params.get('payment_id') || '—';
  document.getElementById('d-ref').textContent        = params.get('ref')        || '—';

  // Confetti
  const colors = ['#0D7A52','#3B6FD4','#F59E0B','#EC4899','#10B981','#6366F1'];
  const wrap = document.getElementById('confetti');
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'c-piece';
    el.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`;
    wrap.appendChild(el);
  }
  setTimeout(() => wrap.remove(), 4000);
</script>
</body>
</html>
