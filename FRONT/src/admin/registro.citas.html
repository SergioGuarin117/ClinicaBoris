<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Médica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F7F5F0;
      --surface:     #FFFFFF;
      --surface-2:   #F0EDE6;
      --border:      #E4E0D8;
      --border-dark: #C9C4B8;
      --text:        #1C1A16;
      --text-2:      #6B6860;
      --text-3:      #A8A49C;

      --confirmada-bg:  #E2F5EC; --confirmada-fg: #14532D; --confirmada-dot: #16a34a;
      --pendiente-bg:   #FEF3C7; --pendiente-fg:  #78350F; --pendiente-dot: #d97706;
      --completada-bg:  #EDE9FE; --completada-fg: #3B0764; --completada-dot: #7c3aed;
      --cancelada-bg:   #FFE4E6; --cancelada-fg:  #881337; --cancelada-dot: #e11d48;

      --radius: 12px;
      --font: 'DM Sans', sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'DM Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-logo {
      display: flex; align-items: center; gap: 10px;
    }
    .header-logo-icon {
      width: 30px; height: 30px;
      background: var(--text);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-logo-icon svg { color: white; }
    .header-logo-text {
      display: flex; flex-direction: column; gap: 0px;
    }
    .header-logo-text span:first-child {
      font-family: var(--serif);
      font-size: 17px; color: var(--text); line-height: 1.1;
    }
    .header-logo-text span:last-child {
      font-size: 10px; color: var(--text-3); letter-spacing: 0.8px; text-transform: uppercase;
    }
    .admin-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px 4px 6px;
    }
    .admin-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 600; color: white; letter-spacing: 0.5px;
    }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      padding: 6px 14px; border-radius: 8px; font-size: 13px;
      text-decoration: none; color: var(--text-2); transition: background 0.12s;
    }
    .nav-link:hover { background: var(--surface-2); }
    .nav-link.active { background: var(--text); color: #fff; }
    .header-right {
      display: flex; align-items: center; gap: 16px;
    }
    .header-clock {
      font-size: 12px; color: var(--text-3); font-family: var(--mono);
      background: var(--surface-2);
      padding: 5px 10px; border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* ── Layout ── */
    .main { max-width: 1180px; margin: 0 auto; padding: 2rem; }

    /* ── Page title ── */
    .page-title { margin-bottom: 1.75rem; }
    .page-title h1 {
      font-family: var(--serif);
      font-size: 32px; font-weight: 400;
      color: var(--text); line-height: 1.1;
    }
    .page-title p {
      font-size: 13px; color: var(--text-3); margin-top: 4px;
    }

    /* ── Métricas ── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .metric-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .metric-card[data-estado="confirmada"]::after { background: var(--confirmada-dot); }
    .metric-card[data-estado="pendiente"]::after  { background: var(--pendiente-dot); }
    .metric-card[data-estado="completada"]::after { background: var(--completada-dot); }
    .metric-card[data-estado="cancelada"]::after  { background: var(--cancelada-dot); }
    .metric-card:hover { border-color: var(--border-dark); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .metric-card:hover::after, .metric-card.active::after { opacity: 1; }
    .metric-card.active {
      border-color: var(--border-dark);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      background: var(--text);
    }
    .metric-card.active .m-value,
    .metric-card.active .m-label { color: rgba(255,255,255,0.9) !important; }
    .metric-card.active::after { opacity: 1; }

    .m-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .m-dot { width: 8px; height: 8px; border-radius: 50%; }
    .metric-card[data-estado="confirmada"] .m-dot { background: var(--confirmada-dot); }
    .metric-card[data-estado="pendiente"]  .m-dot { background: var(--pendiente-dot); }
    .metric-card[data-estado="completada"] .m-dot { background: var(--completada-dot); }
    .metric-card[data-estado="cancelada"]  .m-dot { background: var(--cancelada-dot); }
    .metric-card.active .m-dot { background: rgba(255,255,255,0.5); }

    .m-value {
      font-size: 32px; font-weight: 600; color: var(--text);
      font-family: var(--mono); line-height: 1;
    }
    .m-label {
      font-size: 11px; color: var(--text-3); margin-top: 5px;
      text-transform: uppercase; letter-spacing: 0.7px; font-weight: 500;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filter-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12.5px;
      font-family: var(--font);
      cursor: pointer;
      color: var(--text-2);
      transition: all 0.12s;
      font-weight: 500;
    }
    .filter-btn:hover { border-color: var(--border-dark); color: var(--text); }
    .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    .search-wrap { margin-left: auto; position: relative; }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      opacity: 0.35; pointer-events: none;
    }
    .search-input {
      padding: 7px 12px 7px 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
      width: 220px; outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .search-input:focus {
      border-color: var(--border-dark);
      box-shadow: 0 0 0 3px rgba(28,26,22,0.06);
    }
    .search-input::placeholder { color: var(--text-3); }

    /* ── Status bar ── */
    .status-bar {
      padding: 10px 14px;
      font-size: 13px;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .status-bar.loading { background: #EDE9FE; color: #4C1D95; display: flex; }
    .status-bar.error   { background: var(--cancelada-bg); color: var(--cancelada-fg); display: flex; }

    .spinner {
      width: 13px; height: 13px;
      border: 2px solid #c4b5fd;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabla ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

    thead th {
      padding: 11px 16px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text-2); }
    th .sort-icon { margin-left: 4px; opacity: 0.4; font-size: 10px; }
    th.sorted .sort-icon { opacity: 1; color: var(--text); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      animation: fadeIn 0.2s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    td { padding: 14px 16px; vertical-align: middle; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    .patient-cell { display: flex; align-items: center; gap: 10px; }
    .patient-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .patient-sub  { font-size: 11px; color: var(--text-3); margin-top: 2px; font-family: var(--mono); }

    .time-block { display: flex; flex-direction: column; gap: 2px; }
    .time-hora  { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); }
    .time-fecha { font-size: 11px; color: var(--text-3); }

    .motivo-text { font-size: 13px; color: var(--text-2); max-width: 200px; }
    .notas-text  { font-size: 11px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11.5px; font-weight: 500;
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
    .badge-confirmada { background: var(--confirmada-bg); color: var(--confirmada-fg); }
    .badge-confirmada::before { background: var(--confirmada-dot); }
    .badge-pendiente  { background: var(--pendiente-bg);  color: var(--pendiente-fg); }
    .badge-pendiente::before  { background: var(--pendiente-dot); }
    .badge-completada { background: var(--completada-bg); color: var(--completada-fg); }
    .badge-completada::before { background: var(--completada-dot); }
    .badge-cancelada  { background: var(--cancelada-bg);  color: var(--cancelada-fg); }
    .badge-cancelada::before  { background: var(--cancelada-dot); }

    .empty-row td {
      text-align: center; padding: 56px;
      color: var(--text-3); font-size: 14px;
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }

    .table-footer {
      padding: 10px 16px;
      font-size: 11.5px; color: var(--text-3);
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      font-family: var(--mono);
    }

    @media (max-width: 768px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 1rem; }
      .header { padding: 0 1rem; }
      .page-title h1 { font-size: 24px; }
      table { font-size: 12px; }
      td, th { padding: 10px 10px; }
      .search-input { width: 160px; }
      .motivo-text, .notas-text { max-width: 120px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="header-logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>
    <div class="header-logo-text">
      <span>Agenda Médica</span>
      <span>Panel administrativo</span>
    </div>
  </div>
  <div class="header-right">
    <div class="header-clock" id="now-label"></div>
  </div>
  <nav class="nav-links">
    <a href="panel_admin.html"    class="nav-link">Inicio</a>
    <a href="registro.citas.html" class="nav-link active">Citas</a>
    <a href="estadisticas.html"   class="nav-link">Estadísticas</a>
    <div class="admin-badge">
      <div class="admin-avatar">AD</div>
      Administrador
    </div>
  </nav>
</header>

<main class="main">

  <div class="page-title">
    <h1>Citas agendadas</h1>
    <p>Gestión de appointments · actualización en tiempo real</p>
  </div>

  <div class="status-bar" id="status-bar">
    <div class="spinner"></div>
    <span id="status-msg">Consultando base de datos...</span>
  </div>

  <!-- Métricas -->
  <div class="metrics">
    <div class="metric-card" data-estado="confirmada" onclick="setFilter('confirmada')">
      <div class="m-top"><div class="m-dot"></div></div>
      <div class="m-value" id="cnt-confirmada">—</div>
      <div class="m-label">Confirmadas</div>
    </div>
    <div class="metric-card" data-estado="pendiente" onclick="setFilter('pendiente')">
      <div class="m-top"><div class="m-dot"></div></div>
      <div class="m-value" id="cnt-pendiente">—</div>
      <div class="m-label">Pendientes</div>
    </div>
    <div class="metric-card" data-estado="completada" onclick="setFilter('completada')">
      <div class="m-top"><div class="m-dot"></div></div>
      <div class="m-value" id="cnt-completada">—</div>
      <div class="m-label">Completadas</div>
    </div>
    <div class="metric-card" data-estado="cancelada" onclick="setFilter('cancelada')">
      <div class="m-top"><div class="m-dot"></div></div>
      <div class="m-value" id="cnt-cancelada">—</div>
      <div class="m-label">Canceladas</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="todas"      onclick="setFilter('todas')">Todas</button>
      <button class="filter-btn"        data-filter="confirmada" onclick="setFilter('confirmada')">Confirmadas</button>
      <button class="filter-btn"        data-filter="pendiente"  onclick="setFilter('pendiente')">Pendientes</button>
      <button class="filter-btn"        data-filter="completada" onclick="setFilter('completada')">Completadas</button>
      <button class="filter-btn"        data-filter="cancelada"  onclick="setFilter('cancelada')">Canceladas</button>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="text" id="search" placeholder="Buscar paciente…" oninput="debounceLoad()" />
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable sorted" id="th-fecha" onclick="sortBy('fecha')">Fecha / Hora <span class="sort-icon">↑</span></th>
          <th>Paciente</th>
          <th>Motivo</th>
          <th class="sortable" id="th-estado" onclick="sortBy('estado')">Estado <span class="sort-icon">↕</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="table-footer">
      <span id="footer-count">—</span>
      <span id="footer-time">—</span>
    </div>
  </div>

</main>

<script>
const API_URL = 'http://localhost:8000/api/appointments/citas';

let filtroActual = 'todas';
let sortField    = 'fecha';
let sortDir      = 'asc';
let debounceTimer;

const avatarPalette = [
  ['#D1FAE5','#065F46'], ['#DBEAFE','#1E3A8A'], ['#EDE9FE','#4C1D95'],
  ['#FEF3C7','#78350F'], ['#FFE4E6','#9F1239'], ['#CFFAFE','#164E63'],
  ['#FCE7F3','#831843'], ['#D1FAE5','#14532D'],
];

function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % avatarPalette.length;
  return avatarPalette[h];
}

function initials(name) {
  return name.trim().split(' ').slice(0, 2).map(w => w[0].toUpperCase()).join('');
}

function formatFecha(dateStr) {
  if (!dateStr) return '—';
  const [y, m, d] = dateStr.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}

function updateClock() {
  const now = new Date();
  document.getElementById('now-label').textContent =
    now.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' +
    now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}
updateClock(); setInterval(updateClock, 1000);

function setFilter(f) {
  filtroActual = f;
  document.querySelectorAll('.filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === f)
  );
  document.querySelectorAll('.metric-card').forEach(c =>
    c.classList.toggle('active', c.dataset.estado === f)
  );
  loadCitas();
}

function sortBy(field) {
  if (sortField === field) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortField = field; sortDir = 'asc'; }

  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = '↕';
  });
  const th = document.getElementById('th-' + field);
  if (th) {
    th.classList.add('sorted');
    th.querySelector('.sort-icon').textContent = sortDir === 'asc' ? '↑' : '↓';
  }
  loadCitas();
}

function debounceLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadCitas, 350);
}

async function loadCitas() {
  const buscar = document.getElementById('search').value.trim();
  const params = new URLSearchParams({
    estado: filtroActual,
    orden:  sortDir,
    campo:  sortField,
    ...(buscar && { buscar }),
  });

  setStatus('loading', 'Consultando base de datos...');

  try {
    const res  = await fetch(`${API_URL}?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    renderMetrics(data.conteos || {});
    renderTable(data.citas || []);
    setStatus('');

    const now = new Date();
    document.getElementById('footer-time').textContent =
      'Act. ' + now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  } catch (err) {
    setStatus('error', `Error: ${err.message}`);
    renderTable([]);
  }
}

function setStatus(type, msg = '') {
  const bar = document.getElementById('status-bar');
  bar.className = 'status-bar';
  document.getElementById('status-msg').textContent = msg;
  if (type) bar.classList.add(type);
}

function renderMetrics(conteos) {
  ['confirmada','pendiente','completada','cancelada'].forEach(e => {
    const el = document.getElementById('cnt-' + e);
    if (el) el.textContent = conteos[e] ?? 0;
  });
}

function renderTable(citas) {
  const tbody = document.getElementById('tbody');
  const count = document.getElementById('footer-count');

  count.textContent = `${citas.length} cita${citas.length !== 1 ? 's' : ''}`;

  if (!citas.length) {
    tbody.innerHTML = `
      <tr class="empty-row">
        <td colspan="4">
          <div class="empty-icon">📋</div>
          No se encontraron citas para este filtro.
        </td>
      </tr>`;
    return;
  }

  tbody.innerHTML = citas.map((c, i) => {
    const [bg, fg] = avatarColor(c.paciente);
    const motivo   = c.motivo  ? escHtml(c.motivo)  : '<span style="color:var(--text-3)">—</span>';
    const notas    = c.notas   ? escHtml(c.notas)   : '';
    const cedula   = c.cedula  ? `CC ${escHtml(c.cedula)}` : '';
    return `
      <tr style="animation-delay:${i * 30}ms">
        <td>
          <div class="time-block">
            <div class="time-hora">${c.hora || '—'}</div>
            <div class="time-fecha">${formatFecha(c.fecha)}</div>
          </div>
        </td>
        <td>
          <div class="patient-cell">
            <div class="avatar" style="background:${bg};color:${fg}">${initials(c.paciente)}</div>
            <div>
              <div class="patient-name">${escHtml(c.paciente)}</div>
              ${cedula ? `<div class="patient-sub">${cedula}</div>` : ''}
            </div>
          </div>
        </td>
        <td>
          <div class="motivo-text">${motivo}</div>
          ${notas ? `<div class="notas-text">${notas}</div>` : ''}
        </td>
        <td>
          <span class="badge badge-${c.estado}">${capitalize(c.estado)}</span>
        </td>
      </tr>`;
  }).join('');
}

function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
